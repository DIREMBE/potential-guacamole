[[headers]]
  for = "/usuarios.js"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# La base del panel (11,267 productos, incluidos los dados de baja) no lleva
# costos, pero tampoco tiene por qué salir en Google: el cliente usa
# catalogo-data.json, que es más liviano y solo trae lo que se le enseña.
[[headers]]
  for = "/inventario-data.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# React viaja dentro del sitio con la versión en el nombre del archivo. Como el
# nombre cambia si cambia la versión, el navegador puede guardárselo un año y no
# volver a bajarlo nunca: la portada abre al instante en visitas siguientes.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
